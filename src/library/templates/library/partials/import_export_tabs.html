{# Tabs linking the Export and Import pages, which share the "Import / Export" nav item. #}
{% with current=request.resolver_match.url_name %}
<nav class="flex gap-1 border-b border-gray-200 mb-6" aria-label="Import and export">
    <a href="{% url 'library:export' %}" class="px-4 py-2 text-sm font-medium -mb-px border-b-2 {% if current == 'export' %}border-blue-600 text-blue-700{% else %}border-transparent text-gray-500 hover:text-gray-700{% endif %}"{% if current == 'export' %} aria-current="page"{% endif %}>Export</a>
    <a href="{% url 'library:import' %}" class="px-4 py-2 text-sm font-medium -mb-px border-b-2 {% if current == 'import' %}border-blue-600 text-blue-700{% else %}border-transparent text-gray-500 hover:text-gray-700{% endif %}"{% if current == 'import' %} aria-current="page"{% endif %}>Import</a>
</nav>
{% endwith %}
