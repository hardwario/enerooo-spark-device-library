{% extends "base.html" %}
{% load sorting %}

{% block title %}Models - {{ COMPANY_NAME }}{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold">Models</h2>
    {% if user.is_editor %}
    <a href="{% url 'library:model-create' %}" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm font-medium">
        <i class="bi bi-plus-lg mr-1"></i>Add Model
    </a>
    {% endif %}
</div>

<div class="bg-white rounded-lg shadow mb-4">
    <div class="p-6">
        <form method="get" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end" data-model-filters>
            {% if request.GET.sort %}<input type="hidden" name="sort" value="{{ request.GET.sort }}">{% endif %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Vendor</label>
                <select name="vendor" class="w-full rounded border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2">
                    <option value="">All vendors</option>
                    {% for v in vendors %}
                        <option value="{{ v.slug }}" {% if request.GET.vendor == v.slug %}selected{% endif %}>{{ v.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Technology</label>
                <select name="technology" class="w-full rounded border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2">
                    <option value="">All technologies</option>
                    <option value="modbus" {% if request.GET.technology == "modbus" %}selected{% endif %}>Modbus</option>
                    <option value="lorawan" {% if request.GET.technology == "lorawan" %}selected{% endif %}>LoRaWAN</option>
                    <option value="wmbus" {% if request.GET.technology == "wmbus" %}selected{% endif %}>wM-Bus</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Device Type</label>
                <select name="device_type" class="w-full rounded border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2">
                    <option value="">All types</option>
                    {% for value, label in device_type_choices %}
                        <option value="{{ value }}" {% if request.GET.device_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Provisioning</label>
                <select name="provisioning" class="w-full rounded border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2">
                    <option value="">All models</option>
                    <option value="yes" {% if request.GET.provisioning == "yes" %}selected{% endif %}>With product code</option>
                    <option value="no" {% if request.GET.provisioning == "no" %}selected{% endif %}>Without product code</option>
                </select>
            </div>
        </form>
    </div>
</div>

<div id="model-results">
    {% include "library/partials/devicetype_results.html" %}
</div>

<script>
(function () {
    const filters = document.querySelector('[data-model-filters]');
    const results = document.getElementById('model-results');
    if (!filters || !results) return;

    function loadResults(url, pushHistory) {
        results.setAttribute('aria-busy', 'true');
        return fetch(url, {headers: {'X-Requested-With': 'XMLHttpRequest'}})
            .then(function (response) {
                if (!response.ok) throw new Error('Unable to load models.');
                return response.text();
            })
            .then(function (html) {
                results.innerHTML = html;
                if (pushHistory) history.pushState({}, '', url);
            })
            .catch(function (error) {
                results.insertAdjacentHTML('afterbegin',
                    '<p class="mb-4 rounded bg-red-50 p-3 text-sm text-red-700">' +
                    error.message + ' Please try again.</p>');
            })
            .finally(function () {
                results.removeAttribute('aria-busy');
            });
    }

    filters.addEventListener('change', function () {
        const url = new URL(window.location.href);
        new FormData(filters).forEach(function (value, key) {
            if (value) url.searchParams.set(key, value);
            else url.searchParams.delete(key);
        });
        url.searchParams.delete('page');
        loadResults(url.toString(), true);
    });

    results.addEventListener('click', function (event) {
        const link = event.target.closest('a[href]');
        if (!link || new URL(link.href).origin !== window.location.origin) return;
        if (link.pathname !== window.location.pathname) return;
        event.preventDefault();
        loadResults(link.href, true);
    });

    window.addEventListener('popstate', function () {
        const url = new URL(window.location.href);
        filters.querySelectorAll('select').forEach(function (select) {
            select.value = url.searchParams.get(select.name) || '';
        });
        loadResults(url.toString(), false);
    });
})();
</script>
{% endblock %}
